<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a8c80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="专注">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>专注工作台</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --card2:#f5f1ea;
  --sage:#7a8c80; --sage-d:#5a6b60; --sage-l:#a3b5a8; --sage-p:#e8ede9;
  --terra:#c4886a; --terra-p:#f5e8e0;
  --amber:#e0a458; --amber-p:#fdf3e3;
  --ink:#2d2d2d; --mist:#8a8a8a; --line:#e8e2d8;
  --blue:#5b8bb5; --blue-p:#e6eff6;
  --green:#6aa86a; --green-p:#e6f0e6;
  --orange:#d4944f; --orange-p:#f7ecdd;
  --red:#c05656; --red-p:#f9e8e8;
  --purple:#8b7bb5; --purple-p:#eeeaf6;
  --pink:#d06b8a; --pink-p:#fce8ef;
  --shadow:0 1px 3px rgba(0,0,0,.06);
}
html[data-theme="dark"]{
  --bg:#16181a; --card:#212423; --card2:#1b1e1c;
  --sage:#9bb0a2; --sage-d:#7a8c80; --sage-l:#6a7a70; --sage-p:#2c3530;
  --terra:#d6a085; --terra-p:#332a24;
  --amber:#e8b870; --amber-p:#332c1e;
  --ink:#e8e8e6; --mist:#9a9a98; --line:#333734;
  --blue:#7ba6cc; --blue-p:#1f2a33;
  --green:#8cc08c; --green-p:#1f2c1f;
  --orange:#e0a868; --orange-p:#33291d;
  --red:#d97a7a; --red-p:#331f1f;
  --purple:#a396c9; --purple-p:#262233;
  --pink:#d9a0b6; --pink-p:#2a1e22;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  transition:background .25s,color .25s;
}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}

.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:900px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;flex:1;min-width:0}
.brand .dt{font-weight:400;font-size:12px;color:var(--mist);margin-left:2px}
.iconbtn{width:36px;height:36px;min-width:36px;border:1px solid var(--line);background:var(--card);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn:active{background:var(--card2)}

.navtabs{display:flex;gap:4px;max-width:900px;margin:0 auto;padding:0 14px 8px;overflow-x:auto;scrollbar-width:none}
.navtabs::-webkit-scrollbar{display:none}
.navtab{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--mist);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.navtab.on{background:var(--sage-p);color:var(--sage-d);border-color:var(--sage-l)}

.bottomnav{display:none}
@media(max-width:700px){
  .navtabs{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnitem{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:var(--mist);font-size:11px;cursor:pointer;border-radius:10px}
  .bnitem.on{color:var(--sage-d);background:var(--sage-p)}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h h2{font-size:16px;font-weight:700;flex:1}
.sub{font-size:12px;color:var(--mist);font-weight:400}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.w{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.d{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;min-height:34px;border-radius:9px}
.btn.full{width:100%}
input,select,textarea{
  font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px;outline:none;
}
textarea{min-height:72px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--sage)}
label.fl{display:block;font-size:12px;color:var(--mist);margin:0 0 4px 2px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-blue{background:var(--blue-p);color:var(--blue)}
.t-green{background:var(--green-p);color:var(--green)}
.t-orange{background:var(--orange-p);color:var(--orange)}
.t-red{background:var(--red-p);color:var(--red)}
.t-purple{background:var(--purple-p);color:var(--purple)}
.t-sage{background:var(--sage-p);color:var(--sage-d)}
.t-gray{background:var(--card2);color:var(--mist)}
.t-pink{background:var(--pink-p);color:var(--pink)}
.empty{text-align:center;color:var(--mist);font-size:13px;padding:22px 0}
.hide{display:none!important}
.divider{height:1px;background:var(--line);margin:14px 0}

.todo-strip{background:linear-gradient(135deg,var(--sage-p),var(--card));border:1px solid var(--sage-l)}
.tdrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tdrow:last-child{border-bottom:none}
.tdrow .txt{flex:1;font-size:14px;min-width:0}
.tdrow .txt b{color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}

.task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.cbox{width:24px;height:24px;min-width:24px;border:2px solid var(--sage-l);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cbox.on{background:var(--sage);border-color:var(--sage)}
.task .body{flex:1;min-width:0}
.task .t1{font-size:15px;word-break:break-word}
.task.done .t1{text-decoration:line-through;color:var(--mist)}
.task .meta{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}

.pomo-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:200px;height:200px}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tm{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.ring .md{font-size:12px;color:var(--mist);font-weight:600;letter-spacing:2px}

.catbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.catstage{width:100%;max-width:280px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--card2);border-radius:20px;position:relative;overflow:hidden}
.catstage svg{width:88%;height:88%}
.catsel{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none;max-width:100%}
.catsel::-webkit-scrollbar{display:none}
.csbtn{flex:0 0 auto;min-width:60px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;color:var(--mist);text-align:center}
.csbtn.on{background:var(--terra-p);border-color:var(--terra);color:var(--terra);font-weight:700}
.bars{width:100%;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px}
.bar .bl{width:42px;color:var(--mist);font-weight:600;flex:0 0 42px}
.bar .track{flex:1;height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;transition:width .4s}
.bar .bv{width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mist)}
.evo{background:var(--card2);border-radius:12px;padding:12px;width:100%}
.evorow{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.evorow .ok{color:var(--green);font-weight:700}
.evorow .no{color:var(--mist)}

.qgroup{margin-bottom:6px}
.qgroup-h{font-size:12px;font-weight:700;color:var(--mist);margin:12px 0 6px 2px;letter-spacing:1px}
.quest{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:none}
.quest .qn{flex:1;min-width:0;font-size:14px;font-weight:600}
.quest .qs{font-size:11px;color:var(--mist);font-weight:400;display:block;margin-top:2px}
.week{display:flex;gap:4px}
.wd{width:15px;height:15px;border-radius:50%;background:var(--card2);border:1px solid var(--line)}
.wd.on{background:var(--sage);border-color:var(--sage)}
.wd.today{box-shadow:0 0 0 2px var(--amber)}
.qbtn{min-width:60px;min-height:38px;border-radius:10px;border:1px solid var(--sage-l);background:var(--card);color:var(--sage-d);font-size:13px;font-weight:700;cursor:pointer}
.qbtn.on{background:var(--sage);border-color:var(--sage);color:#fff}

.li{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card2)}
.li-h{display:flex;align-items:flex-start;gap:8px}
.li-h .nm{flex:1;font-weight:700;font-size:15px;word-break:break-word}
.li-m{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.li-f{font-size:13px;color:var(--mist);margin-top:8px;line-height:1.7}
.li-f b{color:var(--ink);font-weight:600}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.st .v{font-size:20px;font-weight:800;line-height:1.2}
.st .k{font-size:11px;color:var(--mist);margin-top:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;color:var(--mist);min-height:34px}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:600}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:701px){.mask{align-items:center;padding:20px}}
.modal{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:701px){.modal{border-radius:18px;padding-bottom:18px}}
.modal h3{font-size:17px;margin-bottom:14px}
.fld{margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.banner{background:var(--amber-p);border:1px solid var(--amber);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:12px}
.quote{font-size:13px;color:var(--mist);font-style:italic;text-align:center;padding:6px 0 2px}
/* AI工坊 */
.ai-modal{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column}
.ai-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.ai-head h3{flex:1;font-size:17px}
.ai-msgs{flex:1;overflow-y:auto;padding:16px 18px}
.ai-msg{max-width:85%;margin-bottom:14px;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.7}
.ai-msg.user{margin-left:auto;background:var(--sage);color:#fff;border-bottom-right-radius:4px}
.ai-msg.bot{background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.ai-input{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.ai-input input{flex:1;border-radius:20px;padding:10px 16px;font-size:15px;min-height:44px}
.ai-input .btn{border-radius:20px;padding:10px 20px}
.ai-config-bar{display:flex;align-items:center;gap:8px;padding:10px 18px;font-size:12px;color:var(--mist);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);flex-wrap:wrap}
.ai-config-bar .stat{font-weight:600}
.ai-config-bar .stat.ok{color:var(--green)}
.ai-config-bar .stat.no{color:var(--red)}
.ai-config-bar input,.ai-config-bar select{min-height:32px;font-size:12px;padding:4px 8px;border-radius:7px;width:auto}
.ai-config-bar .cfg-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%}
.ai-loading{padding:12px 16px;color:var(--mist);font-style:italic}
.cfg-toggle{cursor:pointer;font-size:11px;color:var(--sage-d);text-decoration:underline}
/* 导出弹窗 */
.export-modal .preview{background:var(--card2);border-radius:12px;padding:14px;max-height:50vh;overflow-y:auto;margin-bottom:14px;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all}
.status-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.s-waiting{background:var(--amber-p);color:var(--amber)}
.s-interview{background:var(--blue-p);color:var(--blue)}
.s-rejected{background:var(--red-p);color:var(--red)}
.s-offer{background:var(--green-p);color:var(--green)}
.due-tag{cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.due-edit{cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
/* 日历 */
.cal-switch{display:flex;gap:6px;margin-bottom:12px}
.cal-switch .btn{flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11px;color:var(--mist);font-weight:700;padding:6px 0}
.cal-cell{aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px;cursor:pointer;position:relative;min-height:48px}
.cal-cell:hover{border-color:var(--sage)}
.cal-cell.other{color:var(--mist);background:var(--card2)}
.cal-cell.today{box-shadow:0 0 0 2px var(--amber)}
.cal-cell .cd{font-size:13px;font-weight:700;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal-cell.today .cd{background:var(--amber);color:#fff}
.cal-cell .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:auto}
.cal-cell .dots span{width:5px;height:5px;border-radius:50%}
.cal-week{display:flex;gap:6px}
.cal-wd{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 6px;min-height:120px}
.cal-wd.today{box-shadow:0 0 0 2px var(--amber)}
.cal-wd .wdt{font-size:12px;font-weight:700;text-align:center;margin-bottom:6px}
.cal-wd .wdt small{font-weight:400;color:var(--mist);margin-left:2px}
.cal-wd .evt{font-size:11px;padding:4px 6px;border-radius:6px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-wd .evt.d{background:var(--blue-p);color:var(--blue)}
.cal-wd .evt.s{background:var(--green-p);color:var(--green)}
.cal-wd .evt.l{background:var(--orange-p);color:var(--orange)}
.cal-wd .evt.r{background:var(--purple-p);color:var(--purple)}
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-nav h3{flex:1;font-size:16px;margin:0}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
      <span>专注工作台</span><span class="dt" id="dtLabel"></span>
    </div>
    <button class="iconbtn" id="btnExport" title="导出备份">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </button>
    <button class="iconbtn" id="btnImport" title="导入恢复">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    </button>
    <button class="iconbtn" id="btnTheme" title="深色模式">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <div class="navtabs" id="navtabs"></div>
</div>

<div class="wrap" id="app"></div>
<div class="bottomnav" id="bottomnav"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json" class="hide">
<input type="file" id="catImgIn" accept="image/*" class="hide">

<script>
/* ========== 常量和工具 ========== */
var STORAGE_KEY='focus-workspace-v3';
var CATS={deliver:{n:'投递',c:'t-blue'},study:{n:'学习',c:'t-green'},life:{n:'生活',c:'t-orange'}};
var ITEM_CATS=['周边','衣物','化妆品','数码','文具','书籍','其他'];
var ITEM_STATUS={using:'在用',idle:'闲置',sell:'待出',gone:'已出'};
var APP_STATUS={waiting:'等待',interview:'面试',rejected:'已挂',offer:'Offer'};
var APP_STATUS_CLASS={waiting:'s-waiting',interview:'s-interview',rejected:'s-rejected',offer:'s-offer'};
var RESOURCE_TYPES={video:'视频拆解',bookmark:'资源收藏',note:'学习笔记'};
var CAT_EYES=['圆眼','眯眼','大眼'];
var CAT_DECOR=['无','蝴蝶结','领带','围巾'];
var QUOTES=[
  '按下开始那一下，就断了刷手机的惯性。',
  '完美是完成的敌人，先做出来再说。',
  '你花在挑衣服上的每一小时，都是从面试准备里偷走的。',
  '任务拆到小得\"现在就能开始\"，拖延就没有落脚点。',
  '看见时间花在哪，是改变的第一步。',
  '工具是脚手架，不是引擎。',
  '晚一天投递，就是少一个机会。'
];

function pad(n){return String(n).padStart(2,'0');}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ds(new Date());}
function shiftDay(n){var d=new Date();d.setDate(d.getDate()+n);return ds(d);}
function lastN(n){var a=[];for(var i=n-1;i>=0;i--)a.push(shiftDay(-i));return a;}
function dayGap(a,b){if(!a||!b)return 0;var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.round((y-x)/86400000);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function svg(p,sz,col,w){return '<svg width="'+(sz||18)+'" height="'+(sz||18)+'" viewBox="0 0 24 24" fill="none" stroke="'+(col||'currentColor')+'" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var _tt;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('on');},2000);}
function streakOf(h){var s=0,d=new Date();if(!h[ds(d)])d.setDate(d.getDate()-1);while(h[ds(d)]){s++;d.setDate(d.getDate()-1);}return s;}

/* ========== 加载/迁移/保存 ========== */
var state=null;
function migrate(s){
  var d=defaults();
  if(!s||typeof s!=='object')return d;
  s.version=4; s.lastOpen=s.lastOpen||today();
  s.tasks=Array.isArray(s.tasks)?s.tasks:d.tasks;
  s.tasks.forEach(function(t){if(!t.id)t.id=uid();if(!t.cat)t.cat='life';if(typeof t.repeat!=='boolean')t.repeat=false;if(!t.created)t.created=today();if(!t.due)t.due=t.created||today();});
  s.pomo=Object.assign({focusMin:25,breakMin:5,todayCount:0,hist:{}},s.pomo||{});
  if(!s.pomo.hist)s.pomo.hist={};
  s.fun=Object.assign({budget:60,used:0},s.fun||{});
  s.review=s.review||{};
  s.quests=Array.isArray(s.quests)?s.quests:[];
  if(!s.quests.length){s.quests=d.quests;}
  s.quests.forEach(function(q){if(!q.hist)q.hist={};if(q.group==null)q.group='';});
  if(!s.cats||!Array.isArray(s.cats)||!s.cats.length){
    var oc=s.cat||{name:'团子',hunger:55,mood:60,exp:0,feedToday:0,lastFeed:'',careStreak:0,lastCare:'',born:today()};
    s.cats=[{id:'cat1',name:oc.name||'团子',avatar:'',color:'#eadcc6',eyes:'圆眼',decor:'无',hunger:oc.hunger||55,mood:oc.mood||60,exp:oc.exp||0,feedToday:0,lastFeed:oc.lastFeed||'',careStreak:oc.careStreak||0,lastCare:oc.lastCare||'',born:oc.born||today()}];
    delete s.cat;
  }
  s.activeCat=s.activeCat||(s.cats[0]?s.cats[0].id:'');
  if(typeof s.catFood!=='number')s.catFood=0;
  s.resumes=Array.isArray(s.resumes)?s.resumes:[];
  s.applications=Array.isArray(s.applications)?s.applications:[];
  s.resources=Array.isArray(s.resources)?s.resources:[];
  if(!s.resources.length&&Array.isArray(s.videos)){s.resources=s.videos.map(function(v){v.type=v.type||'video';return v;});delete s.videos;}
  s.resources.forEach(function(r){if(!r.type)r.type='video';});
  s.items=Array.isArray(s.items)?s.items:d.items;
  s.projects=Array.isArray(s.projects)?s.projects:[];
  s.cet4_status=Object.assign({status:'pending',dailyWords:[]},s.cet4_status||{});
  s.ai_workshop=Object.assign({enabled:false,chatHistory:[]},s.ai_workshop||{});
  s.aiConfig=Object.assign({apiKey:'',apiUrl:'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',model:'qwen-plus'},s.aiConfig||{});
  s.ui=Object.assign({dark:false,tab:'today',itemFilter:'全部',resFilter:'全部',calView:'month',calDate:today()},s.ui||{});
  return s;
}
function load(){
  try{var raw=localStorage.getItem(STORAGE_KEY);state=migrate(raw?JSON.parse(raw):null);}
  catch(e){state=defaults();}
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){toast('保存失败：存储空间可能已满');}}

/* ========== 获取当前猫 ========== */
function curCat(){return state.cats.filter(function(c){return c.id===state.activeCat;})[0]||state.cats[0];}

/* ========== 跨日结算 ========== */
function rollover(){
  var t=today();
  if(state.lastOpen===t)return;
  var gap=Math.max(1,dayGap(state.lastOpen,t));
  state.tasks=state.tasks.filter(function(x){return x.repeat||!x.done;});
  state.tasks.forEach(function(x){if(x.repeat)x.done=false;});
  state.fun.used=0;
  state.pomo.todayCount=0;
  state.cats.forEach(function(c){c.feedToday=0;c.hunger=Math.max(0,c.hunger-15*gap);c.mood=Math.max(0,c.mood-10*gap);if(c.lastCare&&dayGap(c.lastCare,t)>1)c.careStreak=0;});
  state.lastOpen=t;
  save();
}

/* ========== 猫粮 ========== */
function addFood(n,why){
  state.catFood+=n;
  var c=curCat();
  if(c){c.mood=Math.min(100,c.mood+Math.floor(n/3));c.exp+=Math.floor(n/2);}
  toast('+'+n+' 猫粮 · '+why);
}

/* ========== 今日要处理 ========== */
function todayIssues(){
  var t=today(),out=[];
  state.tasks.forEach(function(x){
    if(x.done)return;
    var od=dayGap(x.due,t);
    out.push({over:od>=1,txt:(od>=1?'<b class="due-edit" onclick="editDue(\''+x.id+'\')">逾期'+od+'天</b> · ':'')+esc(x.text),act:'完成',fn:'toggleTask("'+x.id+'")'});
  });
  var undone=state.quests.filter(function(q){return !q.hist[t];});
  if(undone.length)out.push({over:false,txt:'今日打卡还差 <b style="color:var(--amber)">'+undone.length+'</b> 项：'+undone.slice(0,3).map(function(q){return esc(q.name);}).join('、')+(undone.length>3?'…':''),act:'去打卡',fn:'go("quest")'});
  state.cats.forEach(function(c){if(c.hunger<25)out.push({over:true,txt:'<b>'+esc(c.name)+'饿坏了</b>（饥饿 '+Math.round(c.hunger)+'）',act:'去喂',fn:'go("cat")'});});
  if(state.fun.used>state.fun.budget)out.push({over:true,txt:'<b>娱乐已超支 '+(state.fun.used-state.fun.budget)+' 分钟</b>',act:'看看',fn:'go("today")'});
  return out;
}

/* ========== 渲染：日程日历（月/周） ========== */
function viewCalendar(){
  var t=today(),view=state.ui.calView||'month',base=state.ui.calDate||t;
  var h='<div class="card"><div class="card-h">'+svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>',18,'var(--terra)')+'<h2>日程日历</h2>'+
    '<div class="cal-switch" style="margin:0 0 0 auto;flex:0 0 auto">'+
    '<button class="btn sm '+(view==='month'?'p':'')+'" onclick="setCalView(\'month\')">月</button>'+
    '<button class="btn sm '+(view==='week'?'p':'')+'" onclick="setCalView(\'week\')">周</button></div></div>';
  if(view==='month')h+=calMonth(base,t);else h+=calWeek(base,t);
  h+='<div class="sub" style="margin-top:10px">点日期可查看当天；要事截止日标在日历上。</div></div>';
  return h;
}
function setCalView(v){state.ui.calView=v;save();render();}
function calNav(base,view){
  var d=new Date(base+'T00:00:00');
  var label=view==='month'?(d.getFullYear()+'年 '+(d.getMonth()+1)+'月'):(d.getFullYear()+'年 '+(d.getMonth()+1)+'月 第'+calWeekNumber(d)+'周');
  return '<div class="cal-nav"><button class="btn sm" onclick="shiftCal(-1)">←</button><h3>'+label+'</h3><button class="btn sm" onclick="shiftCal(1)">→</button><button class="btn sm" onclick="goCalToday()">今天</button></div>';
}
function calWeekNumber(d){
  var y=d.getFullYear(),m=d.getMonth(),dd=d.getDate();
  var fd=new Date(y,m,1),fw=fd.getDay()||7;
  return Math.ceil((dd+fw-1)/7);
}
function shiftCal(n){
  var view=state.ui.calView||'month',d=new Date((state.ui.calDate||today())+'T00:00:00');
  if(view==='month')d.setMonth(d.getMonth()+n);else d.setDate(d.getDate()+n*7);
  state.ui.calDate=ds(d);save();render();
}
function goCalToday(){state.ui.calDate=today();save();render();}
function calMonth(base,t){
  var d=new Date(base+'T00:00:00'),y=d.getFullYear(),m=d.getMonth();
  var fd=new Date(y,m,1),ld=new Date(y,m+1,0);
  var start=new Date(fd);start.setDate(start.getDate()-(start.getDay()||7)+1);
  var cells=[];var cur=new Date(start);
  while(cur<=ld||(cur.getDay()!==1)){cells.push(new Date(cur));cur.setDate(cur.getDate()+1);}
  var h=calNav(base,'month');
  h+='<div class="cal-grid">';
  ['一','二','三','四','五','六','日'].forEach(function(w){h+='<div class="cal-dow">'+w+'</div>';});
  cells.forEach(function(c){
    var s=ds(c),isCur=c.getMonth()===m,isToday=s===t;
    var evts=dayEvents(s);
    h+='<div class="cal-cell '+(isCur?'':'other')+' '+(isToday?'today':'')+'" onclick="showDayDetail(\''+s+'\')">'+
      '<div class="cd">'+c.getDate()+'</div>'+
      (evts.length?'<div class="dots">'+evts.slice(0,4).map(function(e){return '<span style="background:'+e.col+'"></span>';}).join('')+'</div>':'')+
      '</div>';
  });
  h+='</div>';return h;
}
function calWeek(base,t){
  var d=new Date(base+'T00:00:00'),wd=(d.getDay()||7)-1;
  var start=new Date(d);start.setDate(start.getDate()-wd);
  var h=calNav(base,'week');
  h+='<div class="cal-week">';
  for(var i=0;i<7;i++){
    var c=new Date(start);c.setDate(c.getDate()+i);var s=ds(c),isToday=s===t;
    var evts=dayEvents(s);
    h+='<div class="cal-wd '+(isToday?'today':'')+'" onclick="showDayDetail(\''+s+'\')">'+
      '<div class="wdt">'+(c.getMonth()+1)+'/'+c.getDate()+'<small>'+['一','二','三','四','五','六','日'][i]+'</small></div>';
    if(!evts.length)h+='<div class="empty" style="padding:8px 0;font-size:11px">无</div>';
    else evts.forEach(function(e){h+='<div class="evt '+e.k+'" title="'+esc(e.t)+'">'+esc(e.t)+'</div>';});
    h+='</div>';
  }
  h+='</div>';return h;
}
function dayEvents(s){
  var out=[];
  state.tasks.forEach(function(x){
    if(!x.done&&x.due===s)out.push({t:'要事: '+x.text,k:'d',col:'var(--blue)'});
    if(x.done&&x.due===s)out.push({t:'✓ '+x.text,k:'d',col:'var(--sage)'});
  });
  if(state.review[s])out.push({t:'复盘',k:'r',col:'var(--purple)'});
  if(state.review[s+'ev'])out.push({t:'晚间复盘',k:'r',col:'var(--purple)'});
  state.applications.forEach(function(a){if(a.date===s)out.push({t:'投递: '+a.company,k:'d',col:'var(--blue)'});});
  var qn=state.quests.filter(function(q){return q.hist[s];}).length;
  if(qn)out.push({t:'打卡 '+qn+'/'+state.quests.length,k:'s',col:'var(--green)'});
  var p=state.pomo.hist[s]||0;if(p)out.push({t:'番茄 '+p,k:'l',col:'var(--orange)'});
  return out;
}
function showDayDetail(s){
  var evts=dayEvents(s);
  var title=s+(s===today()?'（今天）':'');
  var body='<div style="max-height:50vh;overflow:auto">';
  if(!evts.length)body+='<div class="empty">这一天还没有记录</div>';
  else{
    body+='<div style="font-size:13px;line-height:2">';
    var tasks=state.tasks.filter(function(x){return x.due===s||x.created===s;});
    if(tasks.length){body+='<div style="margin:6px 0"><b>要事</b></div>'+tasks.map(function(x){return '<div>· '+(x.done?'✓ ':'')+esc(x.text)+' <span class="tag '+(x.done?'t-sage':'t-red')+'">'+(x.done?'完成':(dayGap(x.due,s)>=1?'逾期':'待做'))+'</span></div>';}).join('');}
    if(state.review[s])body+='<div><b>复盘：</b>'+esc(state.review[s])+'</div>';
    if(state.review[s+'ev'])body+='<div><b>晚间复盘：</b>'+esc(state.review[s+'ev'])+'</div>';
    var apps=state.applications.filter(function(a){return a.date===s;});
    if(apps.length){body+='<div style="margin:6px 0"><b>投递</b></div>'+apps.map(function(a){return '<div>· '+esc(a.company)+' / '+esc(a.position||'-')+' <span class="status-pill '+APP_STATUS_CLASS[a.status]+'">'+APP_STATUS[a.status]+'</span></div>';}).join('');}
    if(evts.filter(function(e){return e.t.indexOf('打卡')===0;}).length)body+='<div><b>打卡：</b>'+state.quests.filter(function(q){return q.hist[s];}).map(function(q){return q.name;}).join('、')+'</div>';
    if(state.pomo.hist[s])body+='<div><b>番茄钟：</b>'+state.pomo.hist[s]+' 个</div>';
    body+='</div>';
  }
  body+='</div>';
  modal(title,body,function(){addTaskForDate(s);});
  var ok=document.getElementById('mOk');if(ok){ok.textContent='+ 新增要事';}
}
function addTaskForDate(s){
  closeModal();
  modal('新增要事（'+s+' 截止）',
   '<div class="fld"><label class="fl">要做什么</label><input id="mdT" placeholder="越具体越容易开始"></div>'+
   '<div class="grid2"><div class="fld"><label class="fl">分类</label><select id="mdC"><option value="deliver">投递</option><option value="study">学习</option><option value="life">生活</option></select></div>'+
   '<div class="fld"><label class="fl">截止日期</label><input type="date" id="mdDue" value="'+s+'"></div></div>',
   function(){
     var v=document.getElementById('mdT').value.trim();if(!v)return toast('先写点什么');
     var due=document.getElementById('mdDue').value||s;
     state.tasks.push({id:uid(),text:v,cat:document.getElementById('mdC').value,done:false,repeat:false,created:today(),due:due});
     save();render();closeModal();toast('已添加');
   });
}

/* ========== 渲染：打卡 ========== */
function viewQuest(){
  var t=today(),wk=lastN(7);
  var doneN=state.quests.filter(function(q){return q.hist[t];}).length;
  var h='<div class="card"><div class="card-h">'+svg('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',18,'var(--sage)')+
   '<h2>每日打卡</h2><span class="sub">'+doneN+' / '+state.quests.length+'</span><button class="btn sm p" onclick="addQuest()">+ 新增</button></div>';
  var groups={};
  state.quests.forEach(function(q){var g=q.group||'';(groups[g]=groups[g]||[]).push(q);});
  Object.keys(groups).sort(function(a,b){return a===''?1:b===''?-1:a.localeCompare(b);}).forEach(function(g){
    if(g)h+='<div class="qgroup-h">'+esc(g)+'</div>';
    groups[g].forEach(function(q){
      var st=streakOf(q.hist),on=!!q.hist[t];
      h+='<div class="quest"><div class="qn">'+esc(q.name)+
        '<span class="qs">连续 '+st+' 天 · 累计 '+Object.keys(q.hist).length+' 次</span></div>'+
        '<div class="week">'+wk.map(function(d){return '<span class="wd '+(q.hist[d]?'on':'')+' '+(d===t?'today':'')+'"></span>';}).join('')+'</div>'+
        '<button class="qbtn '+(on?'on':'')+'" onclick="toggleQuest(\''+q.id+'\')">'+(on?'已打':'打卡')+'</button>'+
        '<button class="iconbtn" style="width:32px;height:32px;min-width:32px" onclick="delQuest(\''+q.id+'\')">'+svg('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',14,'var(--mist)')+'</button></div>';
    });
  });
  h+='</div>';

  /* 晚间复盘 */
  h+='<div class="card"><div class="card-h">'+svg('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',18,'var(--blue)')+'<h2>晚间复盘</h2></div>'+
   '<textarea id="qrIn" placeholder="详细的今日反思…">'+esc((state.review||{})[t+'ev']||'')+'</textarea>'+
   '<div class="row" style="margin-top:10px"><button class="btn p" onclick="saveQReview()">保存晚间复盘</button></div></div>';

  /* 30天热力 */
  h+='<div class="card"><div class="card-h">'+svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>',18,'var(--terra)')+'<h2>近 30 天完成率</h2></div>';
  var days=lastN(30);
  h+='<svg viewBox="0 0 320 60" style="width:100%">';
  days.forEach(function(d,i){
    var n=state.quests.filter(function(q){return q.hist[d];}).length;
    var r=state.quests.length?n/state.quests.length:0;
    var col=r===0?'var(--card2)':r<.34?'var(--sage-p)':r<.67?'var(--sage-l)':r<1?'var(--sage)':'var(--sage-d)';
    var x=6+(i%10)*31,y=4+Math.floor(i/10)*18;
    h+='<rect x="'+x+'" y="'+y+'" width="26" height="14" rx="4" fill="'+col+'"><title>'+d+'：'+n+'/'+state.quests.length+'</title></rect>';
  });
  h+='</svg><div class="sub" style="margin-top:6px">左上最早，右下今天。颜色越深当天完成越多。</div></div>';
  return h;
}
function saveQReview(){
  var el=document.getElementById('qrIn');if(!el)return;
  var v=el.value.trim(),t=today()+'ev';
  state.review[t]=v;save();toast('已保存晚间复盘');
}

function bar(l,v,col){v=Math.max(0,Math.min(100,v));return '<div class="bar"><span class="bl">'+l+'</span><div class="track"><div class="fill" style="width:'+v+'%;background:'+col+'"></div></div><span class="bv">'+Math.round(v)+'</span></div>';}

function addCat(){

   function(){

     state.cats.push(cat);state.activeCat=cat.id;

function editCat(){
  var c=curCat();if(!c)return;
  modal('编辑 '+esc(c.name),
   '<div class="fld"><label class="fl">名字</label><input id="ecN" value="'+esc(c.name)+'"></div>'+
   '<div class="grid2"><div class="fld"><label class="fl">毛色</label><input type="color" id="ecCol" value="'+esc(c.color)+'"></div>'+
   '<div class="fld"><label class="fl">眼睛</label><select id="ecEy">'+CAT_EYES.map(function(e){return '<option '+(c.eyes===e?'selected':'')+'>'+e+'</option>';}).join('')+'</select></div></div>'+
   '<div class="fld"><label class="fl">装饰</label><select id="ecDec">'+CAT_DECOR.map(function(d){return '<option '+(c.decor===d?'selected':'')+'>'+d+'</option>';}).join('')+'</select></div>'+

   function(){
     var n=document.getElementById('ecN').value.trim();if(!n)return toast('先填名字');
     c.name=n.slice(0,10);c.color=document.getElementById('ecCol').value;
     c.eyes=document.getElementById('ecEy').value;c.decor=document.getElementById('ecDec').value;
     save();render();closeModal();
   });
}
function delCat(){
  if(state.cats.length<=1)return toast('至少保留一只猫');
  var c=curCat();if(!confirm('确定删除 '+c.name+'？'))return;
  state.cats=state.cats.filter(function(x){return x.id!==c.id;});
  state.activeCat=state.cats[0].id;
  save();render();
}
function uploadCatImg(){
  var inp=document.getElementById('catImgIn');
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){curCat().avatar=r.result;save();closeModal();editCat();};
    r.readAsDataURL(f);e.target.value='';
  };
  inp.click();
}
function clearCatImg(){curCat().avatar='';save();closeModal();editCat();}
function feedCat(){
  var c=curCat();if(!c)return;
  if(state.catFood<5)return toast('猫粮不够啦，先去完成一件事');
  if(c.feedToday>=6)return toast('今天喂太多啦，明天再来');
  state.catFood-=5;c.feedToday++;
  c.hunger=Math.min(100,c.hunger+12);
  c.mood=Math.min(100,c.mood+6);
  c.exp+=4;
  var t=today();
  if(c.lastCare!==t){c.careStreak=(c.lastCare===shiftDay(-1)?c.careStreak+1:1);c.lastCare=t;}
  c.lastFeed=t;
  save();render();toast(c.name+'吃得很开心！');
}

   '</select></div>'+
   '<div class="cfg-row"><button class="btn sm p" onclick="saveAICfg()">保存配置</button><button class="btn sm" onclick="toggleAICfg()">取消</button></div>'+
   '</div>'+

   (state.ai_workshop.chatHistory.length?state.ai_workshop.chatHistory.map(function(m){return '<div class="ai-msg '+m.role+'">'+esc(m.text)+'</div>';}).join(''):'<div class="ai-msg bot">你好！我是通义千问。有 '+state.applications.length+' 条投递记录、'+state.resources.length+' 条学习资源。问我点什么？</div>')+

function saveAICfg(){
  var key=document.getElementById('aiCfgKey').value.trim();
  if(!key){toast('请填入 API Key');return;}

  state.aiConfig.model=document.getElementById('aiCfgModel').value;
  save();
  closeAI();openAI();toast('API 配置已保存 ✓');

function closeAI(){var m=document.getElementById('aiModal');if(m)m.remove();}
function sendAI(){
  var inp=document.getElementById('aiIn');if(!inp)return;
  var txt=inp.value.trim();if(!txt)return;
  var cfg=state.aiConfig;
  if(!cfg.apiKey){toast('请先在上方配置 API Key');toggleAICfg();return;}
  state.ai_workshop.chatHistory.push({role:'user',text:txt});
  inp.value='';inp.disabled=true;
  var msgs=document.getElementById('aiMsgs');
  msgs.innerHTML+='<div class="ai-msg user">'+esc(txt)+'</div>';
  /* 加载提示 */
  var loadId='aiLoad'+Date.now();
  msgs.innerHTML+='<div class="ai-msg bot" id="'+loadId+'" style="color:var(--mist)">正在思考...</div>';
  msgs.scrollTop=msgs.scrollHeight;
  /* 构建消息上下文（最近 20 条） */
  var ctx=[{role:'system',content:'你是专注工作台的 AI 助手，用中文回复。你叫 Buddy，直接、有用、不废话。用户叫怡煖，应届生求职中（AI 应用开发方向）。你帮她分析投递策略、优化简历、准备面试、规划学习。你不是客服，是搭档。'}];
  var recent=state.ai_workshop.chatHistory.slice(-20);
  recent.forEach(function(m){ctx.push({role:m.role==='bot'?'assistant':'user',content:m.text});});
  /* 注入当前数据上下文 */
  if(state.applications.length){
    var ac=state.applications.length,ai=state.applications.filter(function(a){return a.status==='interview';}).length;
    ctx.push({role:'system',content:'【当前数据】投递 '+ac+' 条，'+ai+' 个面试中。简历 '+state.resumes.length+' 份。学习资源 '+state.resources.length+' 条。今日要事 '+state.tasks.length+' 项。当用户问投递/学习相关问题时，可以直接引用这些数据。'});
  }
  /* 调用通义千问 */
  var cfg=state.aiConfig;
  fetch(cfg.apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},
    body:JSON.stringify({model:cfg.model,messages:ctx,temperature:0.7,max_tokens:1500})
  }).then(function(r){if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.json();})
  .then(function(d){
    var reply=d.choices&&d.choices[0]&&d.choices[0].message?d.choices[0].message.content:'';
    if(!reply)throw new Error('API 返回空内容');
    var el=document.getElementById(loadId);if(el)el.outerHTML='<div class="ai-msg bot">'+esc(reply)+'</div>';
    state.ai_workshop.chatHistory.push({role:'bot',text:reply});
    save();
    msgs.scrollTop=msgs.scrollHeight;
  }).catch(function(e){
    var el=document.getElementById(loadId);if(el)el.outerHTML='<div class="ai-msg bot" style="color:var(--red)">调用失败：'+esc(e.message||'网络错误')+'<br><span style="font-size:11px;opacity:.7">请检查 API Key 是否正确，或稍后重试</span></div>';
    state.ai_workshop.chatHistory.pop(); /* 移除失败的用户消息 */
    msgs.scrollTop=msgs.scrollHeight;
  }).then(function(){inp.disabled=false;inp.focus();});
  msgs.scrollTop=msgs.scrollHeight;
}

/* ========== 交互：任务 ========== */
function addTask(){
  modal('新增要事',
   '<div class="fld"><label class="fl">要做什么</label><input id="mT" placeholder="越具体越容易开始"></div>'+
   '<div class="grid2"><div class="fld"><label class="fl">分类</label><select id="mC"><option value="deliver">投递</option><option value="study">学习</option><option value="life">生活</option></select></div>'+
   '<div class="fld"><label class="fl">截止日期</label><input type="date" id="mDue" value="'+today()+'"></div></div>'+
   '<div class="fld"><label class="fl">重复</label><select id="mR"><option value="0">一次性</option><option value="1">每日重复</option></select></div>',
   function(){
     var v=document.getElementById('mT').value.trim();if(!v)return toast('先写点什么');
     var due=document.getElementById('mDue').value||today();
     state.tasks.push({id:uid(),text:v,cat:document.getElementById('mC').value,done:false,repeat:document.getElementById('mR').value==='1',created:today(),due:due});
     save();render();closeModal();
   });
}
function editDue(id){
  var x=state.tasks.filter(function(t){return t.id===id;})[0];if(!x)return;
  modal('修改截止日期',
   '<div class="fld"><label class="fl">要事</label><div style="font-size:14px;font-weight:600;padding:8px 0">'+esc(x.text)+'</div></div>'+
   '<div class="fld"><label class="fl">截止日期</label><input type="date" id="dueD" value="'+(x.due||x.created||today())+'"></div>'+
   '<div class="fld"><label class="fl">调整方式</label><select id="dueMode"><option value="set">设为指定日期</option><option value="postpone">延后 N 天</option></select></div>'+
   '<div class="fld"><label class="fl">延后天数（选"延后"时有效）</label><input type="number" id="dueN" value="1" min="0"></div>',
   function(){
     var mode=document.getElementById('dueMode').value;
     if(mode==='postpone'){
       var n=parseInt(document.getElementById('dueN').value,10)||0;
       var d=new Date(x.due+'T00:00:00');d.setDate(d.getDate()+n);
       x.due=ds(d);
     }else{
       x.due=document.getElementById('dueD').value||x.due||today();
     }
     save();render();closeModal();toast('截止日期已更新');
   });
}
function toggleTask(id){
  var x=state.tasks.filter(function(t){return t.id===id;})[0];if(!x)return;
  x.done=!x.done;
  if(x.done){
    addFood(5,'完成要事');
    if(state.tasks.length&&state.tasks.every(function(t){return t.done;})){state.catFood+=10;var c=curCat();if(c)c.mood=Math.min(100,c.mood+8);toast('今日要事全部完成！额外 +10 猫粮');}
  }
  save();render();
}
function delTask(id){if(!confirm('删除这条要事？'))return;state.tasks=state.tasks.filter(function(t){return t.id!==id;});save();render();}

/* ========== 交互：打卡 ========== */
function toggleQuest(id){
  var q=state.quests.filter(function(x){return x.id===id;})[0];if(!q)return;
  var t=today();
  if(q.hist[t]){delete q.hist[t];}
  else{
    q.hist[t]=true;addFood(2,'打卡 '+q.name);
    if(state.quests.every(function(x){return x.hist[t];})){state.catFood+=5;var c=curCat();if(c)c.mood=Math.min(100,c.mood+5);toast('今日打卡全清！额外 +5 猫粮');}
  }
  save();render();
}
function addQuest(){
  modal('新增打卡项',
   '<div class="fld"><label class="fl">名称</label><input id="qN" placeholder="例：喝水 2L / 背单词"></div>'+
   '<div class="fld"><label class="fl">分组（可留空）</label><input id="qG" placeholder="例：学习 / 日常"></div>',
   function(){
     var n=document.getElementById('qN').value.trim();if(!n)return toast('先填名称');
     state.quests.push({id:uid(),name:n,group:document.getElementById('qG').value.trim(),hist:{}});
     save();render();closeModal();
   });
}
function delQuest(id){if(!confirm('删除这个打卡项？历史记录也会一起删除。'))return;state.quests=state.quests.filter(function(q){return q.id!==id;});save();render();}

/* ========== 交互：物品 ========== */
function setItemFilter(c){state.ui.itemFilter=c;save();render();}
function editItem(id){
  var x=id?state.items.filter(function(i){return i.id===id;})[0]:{name:'',cat:'周边',qty:1,place:'',price:'',date:today(),status:'using',note:''};
  if(!x)return;
  modal(id?'编辑物品':'新增物品',
   '<div class="fld"><label class="fl">名称</label><input id="iN" value="'+esc(x.name)+'"></div>'+
   '<div class="grid2"><div class="fld"><label class="fl">分类</label><select id="iC">'+ITEM_CATS.map(function(c){return '<option '+(x.cat===c?'selected':'')+'>'+c+'</option>';}).join('')+'</select></div>'+
   '<div class="fld"><label class="fl">数量</label><input type="number" id="iQ" value="'+(x.qty||1)+'" min="1"></div></div>'+
   '<div class="fld"><label class="fl">存放位置</label><input id="iP" value="'+esc(x.place)+'"></div>'+
   '<div class="grid2"><div class="fld"><label class="fl">价格（¥）</label><input type="number" id="iR" value="'+(x.price||'')+'" min="0"></div>'+
   '<div class="fld"><label class="fl">入手日期</label><input type="date" id="iD" value="'+esc(x.date)+'"></div></div>'+
   '<div class="fld"><label class="fl">状态</label><select id="iS">'+Object.keys(ITEM_STATUS).map(function(k){return '<option value="'+k+'" '+(x.status===k?'selected':'')+'>'+ITEM_STATUS[k]+'</option>';}).join('')+'</select></div>'+
   '<div class="fld"><label class="fl">备注</label><textarea id="iM">'+esc(x.note)+'</textarea></div>',
   function(){
     var n=document.getElementById('iN').value.trim();if(!n)return toast('先填名称');
     var o={id:id||uid(),name:n,cat:document.getElementById('iC').value,qty:Number(document.getElementById('iQ').value)||1,
       place:document.getElementById('iP').value.trim(),price:Number(document.getElementById('iR').value)||0,
       date:document.getElementById('iD').value||today(),status:document.getElementById('iS').value,note:document.getElementById('iM').value.trim()};
     if(id)state.items=state.items.map(function(i){return i.id===id?o:i;});else state.items.push(o);
     save();render();closeModal();
   });
}
function delItem(id){if(!confirm('删除这件物品记录？'))return;state.items=state.items.filter(function(i){return i.id!==id;});save();render();}

/* ========== 娱乐 / 复盘 ========== */
function useFun(n){state.fun.used=Math.max(0,state.fun.used+n);save();render();}
function useFunAsk(){var v=prompt('这次花了多少分钟？（负数=找回）','20');if(v===null)return;var n=parseInt(v,10);if(isNaN(n))return toast('请输入数字');useFun(n);}
function saveReview(){
  var el=document.getElementById('rvIn');if(!el)return;
  var v=el.value.trim(),t=today(),had=!!state.review[t];
  if(!v)return toast('写一句就行');
  state.review[t]=v;
  if(!had)addFood(2,'写了复盘');else toast('已更新');
  save();render();
}

/* ========== 番茄钟 ========== */
var pomoRun=false,pomoBreak=false,pomoLeft=0,pomoTimer=null;
function pomoInit(){pomoLeft=state.pomo.focusMin*60;}
function pomoToggle(){
  pomoRun=!pomoRun;
  if(pomoRun){pomoTimer=setInterval(pomoTick,1000);}else{clearInterval(pomoTimer);}
  render();
}
function pomoTick(){
  pomoLeft--;
  if(pomoLeft<=0){
    clearInterval(pomoTimer);pomoRun=false;
    if(!pomoBreak){
      state.pomo.todayCount++;
      var t=today();state.pomo.hist[t]=(state.pomo.hist[t]||0)+1;
      pomoBreak=true;pomoLeft=state.pomo.breakMin*60;
    }else{pomoBreak=false;pomoLeft=state.pomo.focusMin*60;}
    beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);
    save();
  }
  var tm=document.querySelector('.ring .tm');
  if(tm&&pomoLeft>0){
    tm.textContent=pad(Math.floor(pomoLeft/60))+':'+pad(pomoLeft%60);
    var R=88,C=2*Math.PI*R,tot=(pomoBreak?state.pomo.breakMin:state.pomo.focusMin)*60;
    var c2=document.querySelectorAll('.ring svg circle')[1];
    if(c2)c2.setAttribute('stroke-dashoffset',C*(1-(tot-pomoLeft)/tot));
  }else render();
}
function pomoReset(){clearInterval(pomoTimer);pomoRun=false;pomoLeft=(pomoBreak?state.pomo.breakMin:state.pomo.focusMin)*60;render();}
function pomoSwitch(){clearInterval(pomoTimer);pomoRun=false;pomoBreak=!pomoBreak;pomoLeft=(pomoBreak?state.pomo.breakMin:state.pomo.focusMin)*60;render();}
function beep(){
  try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var a=new C();
    [0,.18,.36].forEach(function(d){var o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(0,a.currentTime+d);g.gain.linearRampToValueAtTime(.22,a.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+.16);
    o.start(a.currentTime+d);o.stop(a.currentTime+d+.18);});
  }catch(e){}
}

/* ========== 设置 / 数据 ========== */
function saveSettings(){
  state.pomo.focusMin=Math.max(1,Number(document.getElementById('setFocus').value)||25);
  state.pomo.breakMin=Math.max(1,Number(document.getElementById('setBreak').value)||5);
  state.fun.budget=Math.max(0,Number(document.getElementById('setFun').value)||60);
  if(!pomoRun)pomoLeft=(pomoBreak?state.pomo.breakMin:state.pomo.focusMin)*60;
  save();render();toast('设置已保存');
}
function toggleTheme(){
  state.ui.dark=!state.ui.dark;
  document.documentElement.setAttribute('data-theme',state.ui.dark?'dark':'light');
  save();
}

/* ========== JSON 导出：两步法（弹窗预览 + 下载/复制） ========== */
function doExport(){
  var json=JSON.stringify(state,null,2);
  modal('导出 JSON 备份',
   '<div class="export-modal"><div class="preview">'+esc(json)+'</div>'+
   '<div class="row"><button class="btn p" id="expDownload">下载文件</button><button class="btn" id="expCopy">复制数据</button></div></div>',
   function(){/* 空回调，按钮自己绑事件 */});
  setTimeout(function(){
    var btnD=document.getElementById('expDownload');
    var btnC=document.getElementById('expCopy');
    if(btnD)btnD.onclick=function(){
      var blob=new Blob([json],{type:'application/json'});
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='专注工作台备份-'+today()+'.json';document.body.appendChild(a);a.click();
      document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},1500);
      toast('文件已下载');closeModal();
    };
    if(btnC)btnC.onclick=function(){
      if(navigator.clipboard){navigator.clipboard.writeText(json).then(function(){toast('已复制到剪贴板');},function(){toast('复制失败，请手动选择文字复制');});}
      else{toast('请手动选择预览区文字复制');}
    };
  },100);
}
function doImport(){document.getElementById('fileIn').click();}
function exportWeek(){
  var wk=lastN(7),t=today();
  var pomos=wk.reduce(function(a,d){return a+(state.pomo.hist[d]||0);},0);
  var qn=wk.reduce(function(a,d){return a+state.quests.filter(function(q){return q.hist[d];}).length;},0);
  var best=0;state.quests.forEach(function(q){best=Math.max(best,streakOf(q.hist));});
  var apps=state.applications.length;
  var txt='【专注工作台 · 周报】'+wk[0]+' ~ '+t+'\n\n'+
    '· 番茄钟：'+pomos+' 个（约 '+(pomos*state.pomo.focusMin)+' 分钟专注）\n'+
    '· 打卡完成：'+qn+' 人次，最长连续 '+best+' 天\n'+
    '· 投递记录：'+apps+' 条\n'+
    '· 学习资源：累计 '+state.resources.length+' 条\n'+
    '· 物品记录：'+state.items.length+' 条\n'+
    '· 数字项目：'+state.projects.length+' 个\n'+
    '· 猫咪：'+state.cats.length+' 只，猫粮 '+state.catFood+'\n\n'+
    '本周复盘：\n'+wk.map(function(d){return state.review[d]?('  '+d+'　'+state.review[d]):'';}).filter(Boolean).join('\n');
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast('周报已复制到剪贴板');},function(){});
  var blob=new Blob([txt],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='周报-'+t+'.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
}
function resetAll(){
  if(!confirm('确定重置全部数据？建议先导出备份。'))return;
  if(!confirm('再确认一次：所有数据都会被删除且无法撤销。'))return;
  localStorage.removeItem(STORAGE_KEY);location.reload();
}

/* ========== 弹窗 ========== */
function modal(title,body,onOk){
  closeModal();
  var d=document.createElement('div');d.className='mask';d.id='mask';
  d.innerHTML='<div class="modal"><h3>'+esc(title)+'</h3>'+body+
    '<div class="row" style="margin-top:6px"><button class="btn p" style="flex:1" id="mOk">保存</button><button class="btn" style="flex:1" onclick="closeModal()">取消</button></div></div>';
  document.body.appendChild(d);
  d.addEventListener('click',function(e){if(e.target===d)closeModal();});
  var okBtn=document.getElementById('mOk');if(okBtn&&onOk)okBtn.onclick=onOk;
  var f=d.querySelector('input,textarea,select');if(f)setTimeout(function(){f.focus();},80);
}
function closeModal(){var m=document.getElementById('mask');if(m)m.remove();}

/* ========== 路由 & 渲染 ========== */
function go(k){state.ui.tab=k;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){
  var t=state.ui.tab||'today';
  document.getElementById('navtabs').innerHTML=TABS.map(function(x){
    return '<button class="navtab '+(t===x.k?'on':'')+'" onclick="go(\''+x.k+'\')">'+svg(x.ic,15)+x.n+'</button>';
  }).join('');
  document.getElementById('bottomnav').innerHTML=TABS.map(function(x){
    return '<button class="bnitem '+(t===x.k?'on':'')+'" onclick="go(\''+x.k+'\')">'+svg(x.ic,19)+'<span>'+x.n+'</span></button>';
  }).join('');
  var v = t==='quest'?viewQuest():t==='cat'?viewCat():t==='learn'?viewLearn():t==='workshop'?viewWorkshop():t==='tools'?viewTools():viewToday();
  document.getElementById('app').innerHTML=v;
  var d=new Date(),wd=['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('dtLabel').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+wd;
}

/* ========== 启动 ========== */
load();
rollover();
try{var _q=new URLSearchParams(location.search).get('tab');if(_q&&TABS.filter(function(x){return x.k===_q;}).length)state.ui.tab=_q;}catch(e){}
document.documentElement.setAttribute('data-theme',state.ui.dark?'dark':'light');
pomoInit();
render();

document.getElementById('btnExport').onclick=doExport;
document.getElementById('btnImport').onclick=doImport;
document.getElementById('btnTheme').onclick=toggleTheme;
document.getElementById('fileIn').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!confirm('导入将覆盖当前全部数据，确定继续？'))return;
      state=migrate(o);save();
      document.documentElement.setAttribute('data-theme',state.ui.dark?'dark':'light');
      pomoInit();render();toast('导入成功');
    }catch(err){toast('文件格式不对，导入失败');}
    e.target.value='';
  };
  r.readAsText(f);
};
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.activeElement&&document.activeElement.id==='rvIn')saveReview();
});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
